# General-purpose profile: readability plus audience fit.
# Add context.audience to score audience fit against a real audience.
name: article
description: Clarity, structure and audience fit for an article

context:
  audience: "the readers this piece is written for"

criteria:
  clarity:
    weight: 1.0
  structure:
    weight: 1.0
  audience_fit:
    weight: 1.5
