# How-it-works coverage: 4 atomic questions (steps, user perspective,
# inputs/outputs, end result). Fills {{subject}} from context.
# Copy this file and set context.subject for your product.
name: how-it-works
description: How-it-works coverage of a product or feature

context:
  subject: "the product or feature being documented"

criteria:
  how_it_works_steps:
    weight: 1.0
  how_it_works_user_perspective:
    weight: 1.0
  how_it_works_inputs_outputs:
    weight: 1.0
  how_it_works_end_result:
    weight: 1.0
