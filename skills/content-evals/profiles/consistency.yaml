# Consistency, decomposed (TypeSafe rule: one dimension per Score question —
# a single consistency question mixes terminology, formatting and language
# register, and confidence drops on text strong in one and weak in another).
# Criteria live in the engine catalogue; this file selects and weights them.
# A single quick-check `consistency` criterion remains available in the
# catalogue for custom profiles.
name: consistency
description: Consistency of terminology, formatting and language conventions

criteria:
  consistency_terminology:
    weight: 1.0
  consistency_formatting:
    weight: 1.0
  consistency_language:
    weight: 1.0